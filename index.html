<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NimbusIQ — Cloud-hosted weather analytics platform with real-time forecasts, historical data analysis, and interactive visualizations powered by Open-Meteo.">
  <meta name="keywords" content="weather, analytics, forecast, historical weather, air quality, climate, dashboard">
  <meta name="author" content="NimbusIQ">
  <meta name="theme-color" content="#060a14">

  <title>NimbusIQ — Weather Analytics Platform</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- CSS -->
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/dashboard.css">
  <link rel="stylesheet" href="styles/charts.css">
  <link rel="stylesheet" href="styles/animations.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- App -->
  <script type="module" src="js/app.js"></script>

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
</head>
<body>
  <div class="app">
    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__logo">⛅</div>
        <div class="sidebar__brand-text">
          <div class="sidebar__title gradient-text">NimbusIQ</div>
          <div class="sidebar__subtitle">Weather Analytics</div>
        </div>
        <button class="sidebar__collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button>
      </div>

      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Overview</div>
        <div class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <span class="nav-item__icon">🏠</span>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-view="forecast" id="nav-forecast">
          <span class="nav-item__icon">📅</span>
          <span>Forecast</span>
        </div>

        <div class="sidebar__section-label">Analysis</div>
        <div class="nav-item" data-view="historical" id="nav-historical">
          <span class="nav-item__icon">📜</span>
          <span>Historical Data</span>
        </div>
        <div class="nav-item" data-view="charts" id="nav-charts">
          <span class="nav-item__icon">📊</span>
          <span>Analytics</span>
        </div>
        <div class="nav-item" data-view="airquality" id="nav-airquality">
          <span class="nav-item__icon">💨</span>
          <span>Air Quality</span>
        </div>

        <div class="sidebar__section-label">System</div>
        <div class="nav-item" data-view="apidocs" id="nav-apidocs">
          <span class="nav-item__icon">📖</span>
          <span>API & Docs</span>
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__city">
          <span class="sidebar__city-dot"></span>
          <span class="sidebar__city-name" id="currentCityName">New Delhi, India</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header Bar -->
      <header class="header">
        <div class="header__search">
          <span class="header__search-icon">🔍</span>
          <input
            type="text"
            class="header__search-input"
            id="searchInput"
            placeholder="Search city..."
            autocomplete="off"
            aria-label="Search for a city"
          >
          <div class="search-results" id="searchResults"></div>
        </div>

        <div class="header__actions">
          <div class="toggle-group tooltip" data-tooltip="°C / °F">
            <span class="toggle-label">°C</span>
            <div class="toggle active" id="unitToggle"></div>
            <span class="toggle-label">°F</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content" id="pageContent">
        <div class="empty-state" style="padding-top:20vh">
          <div class="spinner spinner--lg"></div>
          <p style="margin-top:var(--space-md);color:var(--text-tertiary)">Loading weather data...</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
